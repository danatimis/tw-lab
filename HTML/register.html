<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Înregistrare</title>
  <link rel="stylesheet" href="../CSS/register_style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Înregistrează-te</h1>
      <form class="register-form" action="#" method="post" enctype="multipart/form-data">
        
        <div class="row">
          <label for="username">Nume de utilizator</label>
          <input type="text" id="username" name="username" placeholder="ex: ioanaTW" required>
        </div>

        <div class="row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="ex: ioana@domeniu.ro" required>
        </div>

        <div class="row two-col">
          <div>
            <label for="password">Parolă</label>
            <input type="password" id="password" name="password" required>
          </div>
          <div>
            <label for="confirm_password">Confirmă parola</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
          </div>
        </div>

        <div class="row">
          <label for="date_of_birth">Data nașterii</label>
          <input type="date" id="date_of_birth" name="date_of_birth" required>
        </div>

        <div class="row">
          <label for="country">Țară</label>
          <select id="country" name="country" required>
            <option value="">Selectează o țară</option>
            <option value="România">România</option>
            <option value="Ungaria">Ungaria</option>
            <option value="Bulgaria">Bulgaria</option>
            <option value="Ucraina">Ucraina</option>
            <option value="Moldova">Moldova</option>
            <option value="Serbia">Serbia</option>
            <option value="Altă țară">Altă țară</option>
          </select>
        </div>

        <div class="actions">
          <button type="submit" class="btn primary">Înregistrează-te</button>
          <button type="reset" class="btn ghost">Resetează</button>
        </div>

        <p class="login-link">
          Ai deja cont? <a href="login.html">Mergi la login</a>
        </p>

      </form>
    </section>
  </main>
</body>
</html>
